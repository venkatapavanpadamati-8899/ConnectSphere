<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="28" fill="url(#logoGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9" />
  <ellipse cx="50" cy="50" rx="30" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3" transform="rotate(30 50 50)" opacity="0.8" />
  <ellipse cx="50" cy="50" rx="30" ry="12" fill="none" stroke="#FFFFFF" stroke-width="3" transform="rotate(-30 50 50)" opacity="0.8" />
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" />
</svg>
