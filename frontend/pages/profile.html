<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | ConnectSphere</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/backgrounds.css">
  <link rel="stylesheet" href="../css/premium.css">
</head>
<body data-page="profile">

  <div class="cs-premium-bg cs-bg-profile">
    <div class="cs-bg-image"></div>
  </div>

  <div class="cs-app-layout">

    <!-- Left Navigation Sidebar -->
    <div id="standard-navigation-container"></div>

    <!-- Main Content Area -->
    <main class="cs-feed-center">
      <header class="top-header">
        <h2 id="page-title">User Profile</h2>
        <div style="display: flex; gap: 10px;">
          <button class="icon-btn-round theme-toggle-btn" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- Profile Header & Banner -->
      <section class="profile-header">
        <div class="cover-image-wrapper">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80" class="cover-image" alt="Cover">
        </div>
        <div class="profile-avatar-row">
          <img src="" id="profile-avatar" class="profile-avatar floating-element" alt="Avatar">
          <div id="profile-actions-container">
             <!-- Dynamically filled with Edit Profile or Follow btn -->
          </div>
        </div>

        <div class="profile-details">
          <h3 id="profile-name">Loading...</h3>
          <div class="username" id="profile-username">@loading</div>
          <p id="profile-bio" style="font-size: 15px; color: var(--text-main); line-height: 1.5; max-width: 600px; margin-bottom: 12px;">
            Loading bio...
          </p>
          
          <div style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
            <span class="achievement-badge"><i class="fa-solid fa-code"></i> Frontend Pioneer</span>
            <span class="achievement-badge"><i class="fa-solid fa-bolt"></i> 60 FPS Designer</span>
            <span class="achievement-badge pulse-badge"><i class="fa-solid fa-shield-halved"></i> Verified Creator</span>
          </div>

          <div class="profile-stats">
            <div class="stat-item"><span class="stat-value" id="stat-post-count">0</span> <span class="stat-label">Posts</span></div>
            <div class="stat-item"><span class="stat-value" id="stat-followers-count">0</span> <span class="stat-label">Followers</span></div>
            <div class="stat-item"><span class="stat-value" id="stat-following-count">0</span> <span class="stat-label">Following</span></div>
          </div>
        </div>
      </section>

      <!-- Profile Posts Stream — dynamically populated by ProfileRenderer -->
      <section id="profile-posts-container">
        <div style="text-align: center; padding: 40px 0; color: var(--text-muted);">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; opacity: 0.5;"></i>
          <p style="margin-top: 12px; font-size: 14px;">Loading posts…</p>
        </div>
      </section>
    </main>

    <!-- Right Sidebar Widgets -->
    <aside class="cs-sidebar-right">
      <div class="cs-module">
        <h3 class="cs-module-title">About Creator</h3>
        <div style="font-size: 13.5px; color: var(--text-muted); line-height: 1.6;">
          <p id="profile-location"><i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> Loading...</p>
        </div>
      </div>
    </aside>

  </div>

  <!-- Modular Scripts -->
  <script src="../js/utils/security.js?v=14.0"></script>
  <script src="../js/state/store.js?v=14.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/env.js?v=14.0"></script>
  <script src="../js/lib/supabaseClient.js?v=14.0"></script>
  <script src="../js/services/authService.js?v=14.0"></script>
  <script src="../js/services/profileService.js?v=14.0"></script>
  <script src="../js/services/postService.js?v=14.0"></script>
  <script src="../js/services/chatService.js?v=14.0"></script>
  <script src="../js/navigation.js?v=14.0"></script>
  <script src="../js/animations.js?v=14.0"></script>
  <script src="../js/effects.js?v=14.0"></script>
  <script src="../js/components/postActions.js?v=14.0"></script>
  <script src="../js/components/profileRenderer.js?v=14.0"></script>
  <script src="../js/app.js?v=14.0"></script>
  <script src="../js/components/navigationRenderer.js?v=14.0"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.AuthService) await window.AuthService.init();
      if (window.NavigationRenderer) window.NavigationRenderer.init("profile");
      if (window.ProfileRenderer) await window.ProfileRenderer.init();
    });
  </script>
</body>
</html>
