<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | ConnectSphere</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>

  <!-- Ambient Grid Pattern Overlay -->
  <div class="background-grid-pattern"></div>

  <div class="cs-app-layout">

    <!-- Left Navigation Sidebar -->
    <div id="standard-navigation-container"></div>

    <!-- Main Content Area -->
    <main class="cs-feed-center">
      <header class="top-header">
        <h2 id="page-title">User Profile</h2>
        <div style="display: flex; gap: 10px;">
          <button class="icon-btn-round theme-toggle-btn" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- Profile Header & Banner -->
      <section class="profile-header">
        <div class="cover-image-wrapper">
          <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80" class="cover-image" alt="Cover">
        </div>
        <div class="profile-avatar-row">
          <img src="" id="profile-avatar" class="profile-avatar floating-element" alt="Avatar">
          <div id="profile-actions-container">
             <!-- Dynamically filled with Edit Profile or Follow btn -->
          </div>
        </div>

        <div class="profile-details">
          <h3 id="profile-name">Loading...</h3>
          <div class="username" id="profile-username">@loading</div>
          <p id="profile-bio" style="font-size: 15px; color: var(--text-main); line-height: 1.5; max-width: 600px; margin-bottom: 12px;">
            Loading bio...
          </p>
          
          <div style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
            <span class="achievement-badge"><i class="fa-solid fa-code"></i> Frontend Pioneer</span>
            <span class="achievement-badge"><i class="fa-solid fa-bolt"></i> 60 FPS Designer</span>
            <span class="achievement-badge pulse-badge"><i class="fa-solid fa-shield-halved"></i> Verified Creator</span>
          </div>

          <div class="profile-stats">
            <div class="stat-item"><span class="stat-value" id="stat-post-count">0</span> <span class="stat-label">Posts</span></div>
            <div class="stat-item"><span class="stat-value" id="stat-followers-count">0</span> <span class="stat-label">Followers</span></div>
            <div class="stat-item"><span class="stat-value" id="stat-following-count">0</span> <span class="stat-label">Following</span></div>
          </div>
        </div>
      </section>

      <!-- Profile Posts Stream -->
      <section>
        <article class="post-card">
          <div class="post-header">
            <div class="post-user-details">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" class="avatar" alt="Avatar">
              <div>
                <div class="post-user-name">Alex Johnson <i class="fa-solid fa-circle-check badge-verified"></i></div>
                <div class="post-time">Yesterday</div>
              </div>
            </div>
          </div>
          <div class="post-caption">
            Welcome to my ConnectSphere portal! Exploring clean code, high-fps animations, and glassmorphism styling. 🌌
          </div>
          <div class="post-actions">
            <button class="action-btn btn-like liked"><i class="fa-solid fa-heart"></i> <span class="like-count">3,890</span></button>
            <button class="action-btn btn-comment-toggle"><i class="fa-regular fa-comment"></i> <span>214</span></button>
            <button class="action-btn"><i class="fa-regular fa-paper-plane"></i></button>
            <button class="action-btn"><i class="fa-regular fa-bookmark"></i></button>
          </div>
        </article>
      </section>
    </main>

    <!-- Right Sidebar Widgets -->
    <aside class="cs-sidebar-right">
      <div class="cs-module">
        <h3 class="cs-module-title">About Creator</h3>
        <div style="font-size: 13.5px; color: var(--text-muted); line-height: 1.6;">
          <p id="profile-location"><i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> Loading...</p>
        </div>
      </div>
    </aside>

  </div>

  <!-- Mobile Bottom Navigation Bar -->
  

  <!-- Modular Scripts -->
  <script src="../js/utils/security.js"></script>
  <script src="../js/state/store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/lib/supabaseClient.js"></script>
  <script src="../js/services/authService.js"></script>
  <script src="../js/services/profileService.js"></script>
  <script src="../js/services/chatService.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/animations.js"></script>
  <script src="../js/effects.js"></script>
  <script src="../js/components/postActions.js"></script>
  <script src="../js/components/profileRenderer.js"></script>
  <script src="../js/app.js"></script>
<script src="../js/components/navigationRenderer.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.AuthService) await window.AuthService.init();
      if (window.NavigationRenderer) window.NavigationRenderer.init("profile");
      if (window.ProfileRenderer) await window.ProfileRenderer.init();
    });
  </script>
</body>
</html>
