<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login | ConnectSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/backgrounds.css">
  <link rel="stylesheet" href="../css/premium.css">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: var(--font-body);
    }

    /* Fixed background behind everything */
    .cs-premium-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background-color: var(--bg-dark);
    }
    
    .cs-premium-bg .cs-bg-image {
      width: 100%;
      height: 100%;
      background-image: url('../assets/backgrounds/bg_login.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      animation: slowPan 60s linear infinite alternate;
    }

    @keyframes slowPan {
      0% { transform: scale(1.05) translate(0, 0); }
      100% { transform: scale(1.1) translate(-2%, 2%); }
    }

    .cs-auth-centered-container {
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .cs-auth-card {
      width: min(100% - 32px, 460px);
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-depth-2), 0 0 0 1px rgba(255, 255, 255, 0.05);
      margin: var(--space-4) auto;
      animation: popIn 0.5s var(--transition);
      z-index: 10;
    }

    .cs-auth-logo-large {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: var(--space-5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
    }
    
    .cs-auth-logo-large i {
      font-size: 2.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cs-auth-header {
      margin-bottom: var(--space-5);
      text-align: center;
    }

    .cs-auth-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: var(--space-2);
      color: var(--text-main);
    }

    .cs-auth-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .cs-form-group {
      margin-bottom: var(--space-4);
      position: relative;
    }

    .cs-form-label {
      display: block;
      margin-bottom: var(--space-2);
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .cs-input-icon-wrapper {
      position: relative;
    }

    .cs-input-icon-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.1rem;
      transition: var(--transition-fast);
    }

    .cs-input {
      width: 100%;
      height: var(--input-height);
      padding: 0 16px 0 44px;
      background: var(--bg-glass-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: var(--transition);
    }

    .cs-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .cs-input:focus + i {
      color: var(--primary-light);
    }

    .cs-password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      transition: var(--transition-fast);
    }
    
    .cs-password-toggle:hover {
      color: var(--text-main);
    }

    .cs-auth-options {
      display: flex;
      justify-content: flex-end;
      margin-bottom: var(--space-5);
    }

    .cs-forgot-link {
      color: var(--primary-light);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .cs-forgot-link:hover {
      color: var(--text-main);
      text-decoration: underline;
    }

    .cs-btn-submit {
      width: 100%;
      height: var(--btn-height);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: var(--shadow-glow);
      transition: var(--bounce-transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-body);
    }

    .cs-btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(79, 70, 229, 0.4);
    }

    .cs-btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .cs-divider {
      display: flex;
      align-items: center;
      margin: var(--space-5) 0;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .cs-divider::before, .cs-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .cs-divider::before { margin-right: var(--space-3); }
    .cs-divider::after { margin-left: var(--space-3); }

    .cs-btn-google {
      width: 100%;
      height: var(--btn-height);
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-3);
      transition: var(--transition);
    }

    .cs-btn-google:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
    }

    .cs-btn-google img {
      width: 20px;
      height: 20px;
    }

    .cs-auth-footer {
      margin-top: var(--space-6);
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .cs-auth-footer a {
      color: var(--primary-light);
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition-fast);
    }
    
    .cs-auth-footer a:hover {
      color: var(--text-main);
      text-decoration: underline;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(15px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .cs-premium-bg .cs-bg-image {
        animation: none;
      }
      .cs-auth-card {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="cs-premium-bg">
    <div class="cs-bg-image"></div>
  </div>

  <div class="cs-auth-centered-container">
    <div class="cs-auth-card">
      
      <div class="cs-auth-logo-large">
        <i class="fa-solid fa-earth-americas"></i>
        <span>ConnectSphere</span>
      </div>

      <div class="cs-auth-header">
        <h1 class="cs-auth-title">Welcome back</h1>
        <p class="cs-auth-subtitle">Log in to continue your journey</p>
      </div>

      <div id="general-error" class="cs-error-msg" style="display:none; text-align:center; margin-bottom: var(--space-4); padding: 10px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius-sm); color: #FCA5A5;"></div>

      <form id="loginForm">
        <div class="cs-form-group">
          <label class="cs-form-label" for="email">Email address</label>
          <div class="cs-input-icon-wrapper">
            <input type="email" id="email" class="cs-input" placeholder="name@example.com" required>
            <i class="fa-regular fa-envelope"></i>
          </div>
        </div>

        <div class="cs-form-group">
          <label class="cs-form-label" for="password">Password</label>
          <div class="cs-input-icon-wrapper">
            <input type="password" id="password" class="cs-input" placeholder="Enter your password" required>
            <i class="fa-solid fa-lock"></i>
            <button type="button" class="cs-password-toggle" id="togglePassword">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="cs-auth-options">
          <a href="forgot-password.html" class="cs-forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="cs-btn-submit" id="loginBtn">
          <span>Log In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="cs-divider">Or continue with</div>

      <button type="button" class="cs-btn-google" id="googleLoginBtn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
        Continue with Google
      </button>

      <div class="cs-auth-footer">
        Don't have an account? <a href="signup.html">Create account</a>
      </div>
      
    </div>
  </div>

  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/lib/supabaseClient.js"></script>
  <script>

    // Password Toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Logging in...';
      btn.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await window.csSupabase.auth.signInWithPassword({
          email,
          password
        });
        if (error) throw error;
        
        window.location.href = 'dashboard.html';
      } catch (error) {
        const errEl = document.getElementById('general-error');
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    // Google Login
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      try {
        const { error } = await window.csSupabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/dashboard.html'
          }
        });
        if (error) throw error;
      } catch (error) {
        const errEl = document.getElementById('general-error');
        errEl.textContent = error.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
