<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ConnectSphere — Log In">
  <title>Log In | ConnectSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="cs-auth-body">

  <div class="cs-auth-bg-wrapper">
    <div class="cs-auth-bg-image"></div>
    <div class="cs-auth-bg-overlay"></div>
    <div class="cs-auth-bg-radial"></div>
    <div class="cs-landing-grid"></div>
  </div>

  <div class="cs-auth-container">
    <main class="cs-auth-card">
      <div class="cs-auth-brand">
        <i class="fa-solid fa-earth-americas"></i>
        <span>Connect<span class="highlight">Sphere</span></span>
      </div>

      <div class="cs-auth-header">
        <h1 class="cs-auth-title">Welcome back</h1>
        <p class="cs-auth-subtitle">Log in to continue your journey</p>
      </div>

      <div id="general-error" class="cs-error-msg" style="display:none; text-align:center; margin-bottom: 24px; padding: 12px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; color: #FCA5A5;"></div>

      <form id="loginForm" class="cs-auth-form">
        <div class="cs-auth-form-group">
          <label class="cs-auth-label" for="email">Email address</label>
          <div class="cs-auth-input-wrapper">
            <input type="email" id="email" class="cs-auth-input" placeholder="name@example.com" autocomplete="email" required>
            <i class="fa-regular fa-envelope cs-auth-input-icon"></i>
          </div>
        </div>

        <div class="cs-auth-form-group">
          <label class="cs-auth-label" for="password">Password</label>
          <div class="cs-auth-input-wrapper">
            <input type="password" id="password" class="cs-auth-input" placeholder="Enter your password" autocomplete="current-password" required>
            <i class="fa-solid fa-lock cs-auth-input-icon"></i>
            <button type="button" class="cs-auth-password-toggle" id="togglePassword">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="cs-auth-options" style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
          <a href="forgot-password.html" class="cs-auth-link">Forgot password?</a>
        </div>

        <button type="submit" class="cs-auth-btn cs-auth-btn-primary" id="loginBtn">
          <span>Log In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="cs-auth-divider">Or continue with</div>

      <button type="button" class="cs-auth-btn cs-auth-btn-google" id="googleLoginBtn" aria-label="Continue with Google">
        <span class="cs-google-icon-wrapper" style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: white; border-radius: 50%; padding: 4px;">
          <svg width="100%" height="100%" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </span>
        <span>Continue with Google</span>
      </button>

      <div class="cs-auth-footer">
        Don't have an account? <a href="signup.html" class="cs-auth-link">Create account</a>
      </div>
      
    </main>
  </div>

  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/lib/supabaseClient.js"></script>
  <script>
    // Password Toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Logging in...';
      btn.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await window.csSupabase.auth.signInWithPassword({
          email,
          password
        });
        if (error) throw error;
        
        window.location.href = 'dashboard.html';
      } catch (error) {
        const errEl = document.getElementById('general-error');
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });

    // Google Login
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      try {
        const { error } = await window.csSupabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/pages/dashboard.html'
          }
        });
        if (error) throw error;
      } catch (error) {
        const errEl = document.getElementById('general-error');
        errEl.textContent = error.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
