<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ConnectSphere — Connect. Share. Discover.">
  <title>ConnectSphere | Connect. Share. Discover.</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/backgrounds.css">
  <link rel="stylesheet" href="../css/premium.css">
  
  <style>
    /* Premium Landing Page Specific Styles */
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .cs-landing-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    /* Desktop/Tablet 2-Column Layout */
    @media (min-width: 768px) {
      .cs-landing-container {
        flex-direction: row;
        align-items: stretch;
      }
    }

    /* Left Side - Content & CTA */
    .cs-landing-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-8) var(--space-5);
      max-width: 600px;
      margin: 0 auto;
      z-index: 20;
    }

    @media (min-width: 768px) {
      .cs-landing-content {
        padding: var(--space-10) var(--space-10);
        max-width: 50%;
        margin: 0;
        align-items: flex-start;
      }
    }

    @media (min-width: 1200px) {
      .cs-landing-content {
        padding: var(--space-12) 10%;
      }
    }

    /* Right Side - Visuals */
    .cs-landing-visual {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 40vh;
      overflow: hidden;
    }
    
    @media (min-width: 768px) {
      .cs-landing-visual {
        min-height: auto;
      }
    }

    .cs-brand-logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: var(--space-10);
      animation: popIn 0.8s var(--transition-slow);
    }

    .cs-brand-logo i {
      color: var(--primary);
      font-size: 2.2rem;
    }

    .cs-landing-hero-text {
      font-family: var(--font-heading);
      font-size: 3rem;
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: var(--space-4);
      color: var(--text-main);
      animation: popIn 1s var(--transition-slow);
    }
    
    @media (min-width: 1024px) {
      .cs-landing-hero-text {
        font-size: 4.5rem;
      }
    }

    .cs-landing-hero-text span {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cs-landing-subtext {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: var(--space-8);
      line-height: 1.6;
      max-width: 480px;
      animation: popIn 1.2s var(--transition-slow);
    }

    .cs-cta-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      width: 100%;
      max-width: 360px;
      animation: popIn 1.4s var(--transition-slow);
    }
    
    @media (min-width: 480px) {
      .cs-cta-group {
        flex-direction: row;
        max-width: none;
      }
    }

    .cs-btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 0 var(--space-6);
      height: 56px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      box-shadow: var(--shadow-glow);
      transition: var(--bounce-transition);
      text-decoration: none;
      flex: 1;
    }

    .cs-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.25);
    }

    .cs-login-link {
      display: inline-block;
      margin-top: var(--space-6);
      color: var(--text-muted);
      font-weight: 500;
      text-decoration: none;
      font-size: 1rem;
      transition: var(--transition-fast);
      animation: popIn 1.6s var(--transition-slow);
    }

    .cs-login-link span {
      color: var(--primary);
      font-weight: 700;
    }
    
    .cs-login-link:hover span {
      text-decoration: underline;
    }

    /* Cinematic Sphere Visuals */
    .cs-visual-sphere-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cs-main-sphere {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(99, 102, 241, 0.2));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.5), 0 20px 60px rgba(37, 99, 235, 0.1);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 15s infinite ease-in-out;
    }
    
    @media (min-width: 1024px) {
      .cs-main-sphere {
        width: 500px;
        height: 500px;
      }
    }

    .cs-inner-sphere {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0) 60%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    
    .cs-orbit-ring {
      position: absolute;
      width: 140%;
      height: 140%;
      border-radius: 50%;
      border: 1px dashed rgba(37, 99, 235, 0.2);
      animation: spin 30s linear infinite;
    }
    
    .cs-orbit-ring::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 15%;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 20px var(--primary);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  
  <div class="cs-premium-bg"></div>

  <div class="cs-landing-container">
    
    <!-- Left Column: Content -->
    <main class="cs-landing-content">
      <div class="cs-brand-logo">
        <i class="fa-solid fa-earth-americas"></i>
        <span>ConnectSphere</span>
      </div>

      <h1 class="cs-landing-hero-text">
        Discover.<br>
        Connect.<br>
        <span>Belong.</span>
      </h1>

      <p class="cs-landing-subtext">
        Join the most elegant space for meaningful social connections, community building, and sharing what matters to you.
      </p>

      <div class="cs-cta-group">
        <a href="signup.html" class="cs-btn-primary">
          Create Account <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>

      <a href="login.html" class="cs-login-link">
        Already have an account? <span>Log in</span>
      </a>
    </main>

    <!-- Right Column: Visual Composition -->
    <aside class="cs-landing-visual">
      <div class="cs-floating-orb cs-orb-1"></div>
      <div class="cs-floating-orb cs-orb-2"></div>
      
      <div class="cs-visual-sphere-container">
        <div class="cs-main-sphere">
          <div class="cs-orbit-ring"></div>
          <div class="cs-inner-sphere"></div>
        </div>
      </div>
    </aside>

  </div>

</body>
</html>
