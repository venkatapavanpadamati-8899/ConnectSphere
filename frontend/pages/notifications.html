<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | ConnectSphere</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/backgrounds.css">
  <link rel="stylesheet" href="../css/premium.css">
</head>
<body data-page="notifications">

  <!-- Ambient Premium Background Layer -->
  <div class="cs-premium-bg cs-bg-notifications">
    <div class="cs-bg-image"></div>
  </div>

  <div class="cs-app-layout">

    <!-- Left Navigation Sidebar (rendered by NavigationRenderer) -->
    <div id="standard-navigation-container"></div>

    <!-- Main Content Area -->
    <main class="cs-feed-center">
      <header class="top-header" style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px;">
        <div>
          <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin: 0;">Notifications</h2>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Stay updated with your social mesh</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="cs-btn-secondary" id="btn-mark-all-read" style="height: 36px; padding: 0 14px; font-size: 0.82rem;" title="Mark all as read">
            <i class="fa-solid fa-check-double" style="margin-right: 6px;"></i> Mark all read
          </button>
          <button class="icon-btn-round theme-toggle-btn" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- Dynamic Notifications Container -->
      <section style="padding: 16px 24px;">
        <div id="notifications-list" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Dynamically populated by NotificationsRenderer from Supabase -->
          <div style="text-align: center; padding: 48px 20px; color: var(--text-muted);">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 28px; color: var(--primary); margin-bottom: 12px; display: block;"></i>
            <p style="font-size: 0.9rem;">Loading notifications…</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Right Sidebar Module -->
    <aside class="cs-sidebar-right">
      <div class="cs-module">
        <h3 class="cs-module-title">Activity Feed</h3>
        <div style="font-size: 13.5px; color: var(--text-muted); line-height: 1.7;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
            <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i>
            <span>Real-time notifications active</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
            <i class="fa-solid fa-bolt" style="color: var(--secondary);"></i>
            <span>Instant social triggers synced</span>
          </div>
          <p style="margin-top: 12px; font-size: 0.82rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 10px;">
            Likes, follows, comments, and mentions from your community appear here automatically.
          </p>
        </div>
      </div>
    </aside>

  </div>

  <!-- Modular Scripts -->
  <script src="../js/utils/security.js?v=14.0"></script>
  <script src="../js/state/store.js?v=14.0"></script>
  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/config/env.js?v=14.0"></script>
  <script src="../js/lib/supabaseClient.js?v=14.0"></script>
  <script src="../js/lib/realtimeManager.js?v=14.0"></script>
  <script src="../js/services/authService.js?v=14.0"></script>
  <script src="../js/services/profileService.js?v=14.0"></script>
  <script src="../js/services/notificationService.js?v=14.0"></script>
  <script src="../js/navigation.js?v=14.0"></script>
  <script src="../js/animations.js?v=14.0"></script>
  <script src="../js/effects.js?v=14.0"></script>
  <script src="../js/components/postActions.js?v=14.0"></script>
  <script src="../js/components/navigationRenderer.js?v=14.0"></script>
  <script src="../js/components/notificationsRenderer.js?v=14.0"></script>
  <script src="../js/app.js?v=14.0"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.AuthService) {
        const authed = await window.AuthService.requireAuth();
        if (!authed) return;
      }
      if (window.NavigationRenderer) window.NavigationRenderer.init("notifications");
      if (window.NotificationsRenderer) await window.NotificationsRenderer.init();
      if (window.applyThemeEffects) window.applyThemeEffects();
    });
  </script>
</body>
</html>
