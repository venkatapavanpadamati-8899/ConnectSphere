<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ConnectSphere — Reset Password">
  <title>Reset Password | ConnectSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    .cs-success-message {
      display: none;
      background: rgba(5, 150, 105, 0.1);
      color: var(--success);
      padding: var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid rgba(5, 150, 105, 0.2);
      margin-bottom: var(--space-5);
      text-align: center;
      font-weight: 500;
      line-height: 1.5;
    }
  </style>
</head>
<body class="cs-auth-body">
  
  <div class="cs-auth-bg-wrapper">
    <div class="cs-auth-bg-image"></div>
    <div class="cs-auth-bg-overlay"></div>
    <div class="cs-auth-bg-radial"></div>
    <div class="cs-landing-grid"></div>
  </div>

  <div class="cs-auth-container">
    <main class="cs-auth-card">
      <div class="cs-auth-brand">
        <i class="fa-solid fa-earth-americas"></i>
        <span>Connect<span class="highlight">Sphere</span></span>
      </div>

      <div class="cs-auth-header">
        <h1 class="cs-auth-title">Reset Password</h1>
        <p class="cs-auth-subtitle">Enter the email address associated with your account, and we'll send you a link to reset your password.</p>
      </div>

      <div id="successMessage" class="cs-success-message">
        <i class="fa-solid fa-circle-check" style="font-size: 1.5rem; margin-bottom: 8px; display: block;"></i>
        Check your email! We've sent password reset instructions to your address.
      </div>

      <div id="general-error" class="cs-error-msg" style="display:none; text-align:center; margin-bottom: 16px; padding: 12px; background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.2); border-radius: 10px; color: #dc2626; font-weight: 500;"></div>

      <form id="forgotPasswordForm" class="cs-auth-form">
        <div class="cs-auth-form-group">
          <label class="cs-auth-label" for="email">Email address</label>
          <div class="cs-auth-input-wrapper">
            <input type="email" id="email" class="cs-auth-input" placeholder="name@example.com" required>
            <i class="fa-regular fa-envelope cs-auth-input-icon"></i>
          </div>
        </div>

        <button type="submit" class="cs-auth-btn cs-auth-btn-primary" id="resetBtn" style="margin-bottom: 24px;">
          <span>Send Reset Link</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 16px;">
        <a href="login.html" class="cs-auth-link" style="display: inline-flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>
      </div>
    </main>
  </div>

  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/lib/supabaseClient.js"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('resetBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
      btn.disabled = true;

      const email = document.getElementById('email').value;
      const errEl = document.getElementById('general-error');
      errEl.style.display = 'none';

      try {
        const { data, error } = await window.csSupabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/pages/reset-password.html',
        });
        
        if (error) throw error;
        
        document.getElementById('forgotPasswordForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
        
      } catch (error) {
        errEl.textContent = error.message || 'An error occurred. Please try again.';
        errEl.style.display = 'block';
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
