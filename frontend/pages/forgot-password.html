<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ConnectSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/backgrounds.css">
  <link rel="stylesheet" href="../css/premium.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cs-auth-card {
      width: 100%;
      max-width: 440px;
      padding: var(--space-8) var(--space-6);
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-depth-1);
      position: relative;
      z-index: 10;
      animation: popIn 0.6s var(--transition);
      margin: var(--space-4);
    }

    .cs-auth-header {
      margin-bottom: var(--space-6);
      text-align: center;
    }

    .cs-auth-title {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: var(--space-2);
      color: var(--text-main);
    }

    .cs-auth-subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .cs-form-group {
      margin-bottom: var(--space-5);
      position: relative;
    }

    .cs-form-label {
      display: block;
      margin-bottom: var(--space-2);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .cs-input-icon-wrapper {
      position: relative;
    }

    .cs-input-icon-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.1rem;
      transition: var(--transition-fast);
    }

    .cs-input {
      width: 100%;
      height: var(--input-height);
      padding: 0 16px 0 44px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 1rem;
      transition: var(--transition);
    }

    .cs-input:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--bg-surface);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .cs-input:focus + i {
      color: var(--primary);
    }

    .cs-btn-submit {
      width: 100%;
      height: var(--btn-height);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: var(--shadow-glow);
      transition: var(--bounce-transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
    }

    .cs-btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.2);
    }

    .cs-btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .cs-back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      color: var(--text-muted);
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition-fast);
    }

    .cs-back-link:hover {
      color: var(--text-main);
    }

    .cs-success-message {
      display: none;
      background: rgba(5, 150, 105, 0.1);
      color: var(--success);
      padding: var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid rgba(5, 150, 105, 0.2);
      margin-bottom: var(--space-5);
      text-align: center;
      font-weight: 500;
      line-height: 1.5;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  
  <div class="cs-premium-bg cs-bg-auth">
    <div class="cs-floating-orb cs-orb-1"></div>
    <div class="cs-floating-orb cs-orb-2"></div>
  </div>

  <div class="cs-auth-card">
    <div class="cs-auth-header">
      <h1 class="cs-auth-title">Reset Password</h1>
      <p class="cs-auth-subtitle">Enter the email address associated with your account, and we'll send you a link to reset your password.</p>
    </div>

    <div id="successMessage" class="cs-success-message">
      <i class="fa-solid fa-circle-check" style="font-size: 1.5rem; margin-bottom: 8px; display: block;"></i>
      Check your email! We've sent password reset instructions to your address.
    </div>

    <form id="forgotPasswordForm">
      <div class="cs-form-group">
        <label class="cs-form-label" for="email">Email address</label>
        <div class="cs-input-icon-wrapper">
          <input type="email" id="email" class="cs-input" placeholder="name@example.com" required>
          <i class="fa-regular fa-envelope"></i>
        </div>
      </div>

      <button type="submit" class="cs-btn-submit" id="resetBtn">
        <span>Send Reset Link</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>

    <a href="login.html" class="cs-back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/env.js"></script>
  <script src="../js/lib/supabaseClient.js"></script>
  <script>

    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('resetBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
      btn.disabled = true;

      const email = document.getElementById('email').value;

      try {
        const { data, error } = await window.csSupabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/pages/reset-password.html', // Redirect after clicking email link
        });
        
        if (error) throw error;
        
        document.getElementById('forgotPasswordForm').style.display = 'none';
        document.getElementById('successMessage').style.display = 'block';
        
      } catch (error) {
        alert(error.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
