  <style>
    /* ── Explore page-specific styles ── */

    /* Search bar */
    .explore-search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg-surface-elevated);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 0 16px;
      gap: 10px;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .explore-search-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.15);
    }
    .explore-search-wrap .search-icon {
      color: var(--text-muted);
      font-size: 1rem;
      flex-shrink: 0;
    }
    .explore-search-wrap input {
      flex: 1;
      min-width: 0;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.05rem;
      font-family: var(--font-body);
      color: var(--text-main);
      padding: 14px 0;
    }
    .explore-search-wrap input::placeholder { color: var(--text-muted); }
    #explore-search-clear {
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--bg-surface);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 26px; height: 26px;
      border-radius: 50%;
      font-size: 0.8rem;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #explore-search-clear:hover { background: var(--bg-surface-hover); color: var(--text-main); }

    /* Category tabs */
    .explore-category-tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
    }
    .explore-category-tabs::-webkit-scrollbar { display: none; }
    .explore-tab-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: var(--radius-full);
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.15s;
    }
    .explore-tab-pill.active,
    .explore-tab-pill:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* Loading skeleton */
    #explore-search-loading {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 24px 0;
    }
    .explore-skeleton {
      background: linear-gradient(90deg, var(--bg-surface-elevated) 25%, var(--bg-surface-hover) 50%, var(--bg-surface-elevated) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.4s ease infinite;
      border-radius: 12px;
    }
    @keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Results container */
    #explore-search-results { display: none; }

    /* Section label */
    .explore-section-label {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .explore-results-section {
      margin-bottom: 28px;
    }
    .explore-empty-section {
      margin-bottom: 28px;
    }

    /* Profile cards grid */
    .explore-grid-profiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .explore-profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
    }
    .explore-profile-card:hover {
      border-color: var(--primary);
      background: var(--bg-surface-elevated);
      transform: translateY(-1px);
    }
    .explore-profile-avatar {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid var(--border-color);
    }
    .explore-profile-info { flex: 1; min-width: 0; }
    .explore-profile-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .explore-profile-handle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .explore-profile-bio {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.4;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .explore-verified-badge {
      color: var(--primary);
      font-size: 11px;
    }

    /* Post cards */
    .explore-results-list { display: flex; flex-direction: column; gap: 12px; }
    .explore-post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      transition: border-color 0.15s;
    }
    .explore-post-card:hover { border-color: rgba(var(--primary-rgb), 0.4); }
    .explore-post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .explore-post-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .explore-post-meta { display: flex; flex-direction: column; gap: 2px; }
    .explore-post-author {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .explore-post-handle-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .explore-post-caption {
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.55;
      margin-bottom: 10px;
    }
    .explore-post-media {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }
    .explore-post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .explore-tag-chip {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--primary);
      padding: 3px 10px;
      background: rgba(var(--primary-rgb), 0.1);
      border-radius: var(--radius-full);
      cursor: pointer;
    }
    .explore-tag-chip:hover { background: rgba(var(--primary-rgb), 0.2); }
    .explore-post-stats {
      display: flex;
      gap: 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .explore-post-stats span { display: flex; align-items: center; gap: 5px; }

    /* Hashtag cards */
    .explore-hashtag-list { display: flex; flex-direction: column; gap: 8px; }
    .explore-hashtag-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .explore-hashtag-card:hover { border-color: #10B981; background: var(--bg-surface-elevated); }
    .explore-hashtag-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10B981;
      font-size: 15px;
      flex-shrink: 0;
    }
    .explore-hashtag-rank {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F59E0B;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .explore-hashtag-info { flex: 1; min-width: 0; }
    .explore-hashtag-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .explore-hashtag-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* No results */
    .explore-no-results {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    /* Empty state */
    #explore-empty-state { display: none; }
  </style>
</head>

  <!-- Initialize ExploreSearchController after all scripts load -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // ExploreSearchController is initialized after auth check completes
      // (app.js runs auth + loads user state first)
      // We wait a short tick to ensure app.js init has completed
      let initDone = false;
      function tryInit() {
        if (initDone) return;
        if (typeof ExploreSearchController !== 'undefined' && typeof SearchService !== 'undefined') {
          initDone = true;
          ExploreSearchController.init().catch(err => {
            console.warn('[Explore] ExploreSearchController.init() error:', err);
          });
        }
      }
      // Try immediately, then fall back to timeout
      setTimeout(tryInit, 800);
      setTimeout(tryInit, 2000);
    });
  </script>
